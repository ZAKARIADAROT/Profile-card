<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile card</title>
    <link rel="stylesheet" href="style.css">
    <!--there exported boxicon file-->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="profile-card">
        <div class="image">
                <img class="profile-image" src="profile/profile.jpg" alt="a profile picture">
        </div>
        <div class="text-data">
            <span class="name">zackdev</span>
            <span class="job">Spoftware Engineer</span>
        </div>
        <div class="media-buttons">
            <a href="#" class="link" style="background-color: #4267b2;">
                <i class='bx bxl-facebook-circle'></i>
            </a>
            <a href="#" class="link" style="background-color: #e1306e;">
                <i class='bx bxl-instagram'></i>
            </a>
            <a href="#" class="link" style="background-color: #1da1f2;">
                <i class='bx bxl-twitter'></i>               
            </a>
            <a href="#" class="link" style="background-color: #f00;">
                <i class='bx bxl-youtube'></i>               
            </a>           
        </div>
        <div class="button">
            <button class="butts">Subscribe</button>
            <button class="butts">Message</button>
        </div>
        <div class="analytics">
            <div class="data">
                <i class="bx bx-heart"></i>
                <span class="likes">1.3M</span>
            </div>
            <div class="data">
                <i class="bx bx-message-rounded"></i>      
                <span class="Message">20k</span>
            </div>
            <div class="data">
                <i class="bx bx-share"></i>
                <span class="Likes">12k</span>
            </div>

        </div>             
    </div>            
</body>
</html>
